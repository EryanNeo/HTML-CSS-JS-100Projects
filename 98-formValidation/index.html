<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <section class="container">
        <form action="">
            <div class="input-container">
                <input type="text" placeholder="Name" class="username" id="username">
                <p class="user-msg msg">Error Message</p>
            </div>
            <div class="input-container">
                <input type="email" placeholder="Email" class="email" id="email">
                <p class="email-msg msg">Error Message</p>
            </div>
            <div class="input-container">
                <input type="password" placeholder="Password" class="password" id="password">
                <p class="password-msg msg">Error Message</p>
            </div>
            <div class="input-container">
                <input type="password" placeholder="Confirm Password" class="password2" id="password2">
                <p class="password2-msg msg">Error Message</p>
            </div>
            <input type="submit" value="Submit" class="submit">
            <p class="already">Already have an account?
                <a href="#">Login</a>
            </p>
        </form>
        <div class="content">
            <img src="Images/bruno-emmanuelle--MUoHL1XULM-unsplash-removebg-preview.png" alt="">
        </div>
    </section>
</body>
</html>
